        materializedAt: { $ref: "#/components/schemas/UtcTimestamp" }
    PudReportingArchiveData:
      type: object
      additionalProperties: false
      required:
        - id
        - locationId
        - aggregateDay
        - watermarkSha256
        - byteSize
        - objectSha256
        - status
        - retentionUntil
        - createdAt
        - verifiedAt
        - restoreProvenAt
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        locationId: { $ref: "#/components/schemas/Identifier" }
        aggregateDay: { type: string, format: date }
        watermarkSha256: { $ref: "#/components/schemas/PudSha256" }
        byteSize: { type: integer, minimum: 1 }
        objectSha256: { $ref: "#/components/schemas/PudSha256" }
        status: { type: string, enum: [staged, verified, restore_proven, failed] }
        retentionUntil: { $ref: "#/components/schemas/UtcTimestamp" }
        createdAt: { $ref: "#/components/schemas/UtcTimestamp" }
        verifiedAt:

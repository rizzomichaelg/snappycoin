        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        phone: { type: string, minLength: 10, maxLength: 32 }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        weightTenths: { $ref: "#/components/schemas/WeightTenths" }
        amountCollectedCents: { $ref: "#/components/schemas/MoneyCents" }
        machineCostCents: { $ref: "#/components/schemas/MoneyCents" }
        externalSource: { type: string, maxLength: 100 }
        externalId: { type: string, maxLength: 200 }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        attribution: { $ref: "#/components/schemas/Attribution" }
    CustomerPhoneChangeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, verificationId, phoneProof, reason]
      properties: { expectedVersion: { type: integer, minimum: 1 }, verificationId: { $ref: "#/components/schemas/Identifier" }, phoneProof: { $ref: "#/components/schemas/Token" }, reason: { type: string, maxLength: 1000 } }
    CustomerPhoneStartRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, phone]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        phone: { type: string, minLength: 10, maxLength: 32 }
    CustomerContactUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, firstName, lastName, email, allergyNotes, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: [string, "null"], format: email, maxLength: 254 }
        allergyNotes: { type: [string, "null"], maxLength: 2000 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CustomerMergeRequest:
      type: object
      additionalProperties: false
      required: [sourceCustomerId, targetCustomerId, sourceExpectedVersion, targetExpectedVersion, reason]
      properties:
        sourceCustomerId: { $ref: "#/components/schemas/Identifier" }
        targetCustomerId: { $ref: "#/components/schemas/Identifier" }
        sourceExpectedVersion: { type: integer, minimum: 1 }
        targetExpectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 2000 }
    CustomerSplitRequest:
      type: object
      additionalProperties: false
      required: [mergeLinkId, sourceExpectedVersion, targetExpectedVersion, reason]
      properties: { mergeLinkId: { $ref: "#/components/schemas/Identifier" }, sourceExpectedVersion: { type: integer, minimum: 1 }, targetExpectedVersion: { type: integer, minimum: 1 }, reason: { type: string, maxLength: 2000 } }
    PromotionCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, code, name, status, discountType, discountValue, perCustomerLimit, newCustomerOnly, minimumOrderCents]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        code: { type: string, pattern: "^[A-Za-z0-9_-]{2,100}$" }
        name: { type: string, maxLength: 200 }
        status: { type: string, enum: [draft, active, paused] }
        discountType: { type: string, enum: [fixed_cents, percent_bps, free_delivery] }
        discountValue: { type: integer, minimum: 0 }
        channel: { type: string, maxLength: 100 }
        campaign: { type: string, maxLength: 200 }
        startsAt: { $ref: "#/components/schemas/UtcTimestamp" }
        endsAt: { $ref: "#/components/schemas/UtcTimestamp" }
        perCustomerLimit: { type: integer, minimum: 1 }
        totalLimit: { type: integer, minimum: 1 }
        newCustomerOnly: { type: boolean }
        minimumOrderCents: { $ref: "#/components/schemas/MoneyCents" }
    PromotionPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 200 }
        status: { type: string, enum: [draft, active, paused, expired, retired] }
        discountType: { type: string, enum: [fixed_cents, percent_bps, free_delivery] }
        discountValue: { type: integer, minimum: 0 }
        channel: { type: [string, "null"] }
        campaign: { type: [string, "null"] }
        startsAt: { anyOf: [{ $ref: "#/components/schemas/UtcTimestamp" }, { type: "null" }] }
        endsAt: { anyOf: [{ $ref: "#/components/schemas/UtcTimestamp" }, { type: "null" }] }
        perCustomerLimit: { type: integer, minimum: 1 }
        totalLimit: { type: [integer, "null"], minimum: 1 }
        newCustomerOnly: { type: boolean }
        minimumOrderCents: { $ref: "#/components/schemas/MoneyCents" }
    ReferralCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, customerId, creditCents]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        customerId: { type: string, minLength: 1, maxLength: 200 }
        creditCents: { type: integer, minimum: 1, maximum: 10000000 }
    AdminRecurringPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, status]
      properties: { expectedVersion: { type: integer, minimum: 1 }, status: { type: string, enum: [active, paused, canceled] }, pauseReason: { type: string, maxLength: 1000 }, nextProposalAt: { $ref: "#/components/schemas/UtcTimestamp" } }
    AdminRecurringCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, customerId, addressId, cadence, preferredRouteRule, preferredBags, detergent, softenerPref]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        customerId: { $ref: "#/components/schemas/Identifier" }
        addressId: { $ref: "#/components/schemas/Identifier" }
        cadence: { type: string, enum: [weekly, biweekly, monthly] }
        preferredRouteRule: { type: object, additionalProperties: true }
        preferredBags: { type: integer, minimum: 1, maximum: 100 }
        detergent: { type: string, enum: [premium, gain, tide, free_clear, customer_supplied] }
        softenerPref: { type: string, enum: [liquid, dryer_sheets, none] }
        specialInstructions: { type: string, maxLength: 2000 }
        nextProposalAt: { $ref: "#/components/schemas/UtcTimestamp" }
    AdminRecurringSkipRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey]
      properties: { expectedVersion: { type: integer, minimum: 1 }, idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" } }
    AdminClaimPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, status]
      properties: { expectedVersion: { type: integer, minimum: 1 }, status: { type: string, enum: [open, investigating, approved, denied, resolved, withdrawn] }, approvedAmountCents: { $ref: "#/components/schemas/MoneyCents" }, resolutionCode: { type: string, maxLength: 100 }, resolutionNotes: { type: string, maxLength: 5000 } }
    AdminSupportCasePatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, status, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        reasonCode: { type: string, minLength: 2, maxLength: 80, pattern: "^[a-z][a-z0-9_]+$" }
    ChannelSpendRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, periodStart, periodEnd, channel, spendCents]
      properties: { idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }, periodStart: { $ref: "#/components/schemas/UtcTimestamp" }, periodEnd: { $ref: "#/components/schemas/UtcTimestamp" }, channel: { type: string, maxLength: 100 }, campaign: { type: string, maxLength: 200 }, spendCents: { $ref: "#/components/schemas/MoneyCents" }, notes: { type: string, maxLength: 2000 } }
    CostRateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, effectiveFrom, processingCostPerLbCents, packagingCostPerOrderCents, vehicleCostPerMileCents, driverCostPerHourCents]
      properties: { idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }, effectiveFrom: { $ref: "#/components/schemas/UtcTimestamp" }, processingCostPerLbCents: { type: integer, minimum: 0 }, packagingCostPerOrderCents: { type: integer, minimum: 0 }, vehicleCostPerMileCents: { type: integer, minimum: 0 }, driverCostPerHourCents: { type: integer, minimum: 0 }, notes: { type: string, maxLength: 2000 } }
    DexterImportRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, sourceFileHash, rows]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        sourceFileHash: { type: string, pattern: "^[a-fA-F0-9]{32,128}$" }
        rows:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [externalId, occurredAt, weightTenths, amountCollectedCents]
            properties: { externalId: { type: string, maxLength: 200 }, occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }, phone: { type: string }, firstName: { type: string }, lastName: { type: string }, weightTenths: { $ref: "#/components/schemas/WeightTenths" }, amountCollectedCents: { $ref: "#/components/schemas/MoneyCents" }, machineCostCents: { $ref: "#/components/schemas/MoneyCents" } }
    OfflineActionImportRequest:
      type: object
      additionalProperties: false
      required: [mode, sourceBatchId, sourceFileHash, actions]
      properties:
        mode: { type: string, enum: [dry_run, apply] }
        sourceBatchId: { $ref: "#/components/schemas/Identifier" }
        sourceFileHash: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        dryRunReceipt: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{31,255}$", writeOnly: true }
        approvalRequestId:
          allOf: [{ $ref: "#/components/schemas/Identifier" }]
          description: Required for apply mode when PUD_DUAL_CONTROL_ENABLED is exactly true; excluded from the governed intent digest.
        actions:
          type: array
          minItems: 1
          maxItems: 500
          items:
            oneOf:
              - { $ref: "#/components/schemas/OfflineRouteStartAction" }
              - { $ref: "#/components/schemas/OfflineRouteCompleteAction" }
              - { $ref: "#/components/schemas/OfflinePickupAction" }
              - { $ref: "#/components/schemas/OfflineIntakeAction" }
              - { $ref: "#/components/schemas/OfflineOutForDeliveryAction" }
              - { $ref: "#/components/schemas/OfflineDeliveredAction" }
              - { $ref: "#/components/schemas/OfflineDeliveryFailedAction" }
      allOf:
        - if: { properties: { mode: { const: apply } }, required: [mode] }
          then: { required: [dryRunReceipt] }
        - if: { properties: { mode: { const: dry_run } }, required: [mode] }
          then: { not: { required: [dryRunReceipt] } }
    OfflineRouteStartAction:
      type: object
      additionalProperties: false
      required: [actionId, action, occurredAt, expectedVersion, routeId, startOdometerTenths]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        action: { const: route_start }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        routeId: { $ref: "#/components/schemas/Identifier" }
        startOdometerTenths: { type: integer, minimum: 0, maximum: 10000000 }
    OfflineRouteCompleteAction:
      type: object
      additionalProperties: false
      required: [actionId, action, occurredAt, expectedVersion, routeId, endOdometerTenths, milesTenths, stopsCompleted]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        action: { const: route_complete }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        routeId: { $ref: "#/components/schemas/Identifier" }
        endOdometerTenths: { type: integer, minimum: 0, maximum: 10000000 }
        milesTenths: { type: integer, minimum: 0, maximum: 10000000 }
        stopsCompleted: { type: integer, minimum: 0, maximum: 100000 }
    OfflinePickupAction:
      type: object
      additionalProperties: false
      required: [actionId, action, occurredAt, expectedVersion, orderId, bagIds, actualBags, pickupMode]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        action: { const: pickup }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        orderId: { $ref: "#/components/schemas/Identifier" }
        bagIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/Identifier" } }
        actualBags: { type: integer, minimum: 1, maximum: 100 }
        station: { $ref: "#/components/schemas/Identifier" }
        pickupMode: { type: string, enum: [attended, unattended] }
    OfflineIntakeAction:
      type: object
      additionalProperties: false
      required: [actionId, action, occurredAt, expectedVersion, orderId, bagIds, actualBags]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        action: { const: intake }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        orderId: { $ref: "#/components/schemas/Identifier" }
        bagIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/Identifier" } }
        actualBags: { type: integer, minimum: 1, maximum: 100 }
        station: { $ref: "#/components/schemas/Identifier" }
    OfflineOutForDeliveryAction:
      type: object
      additionalProperties: false
      required: [actionId, action, occurredAt, expectedVersion, orderId, bagIds, actualBags]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        action: { const: out_for_delivery }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        orderId: { $ref: "#/components/schemas/Identifier" }
        bagIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/Identifier" } }
        actualBags: { type: integer, minimum: 1, maximum: 100 }
        station: { $ref: "#/components/schemas/Identifier" }
    OfflineDeliveredAction:
      type: object
      additionalProperties: false
      required: [actionId, action, occurredAt, expectedVersion, orderId, bagIds, actualBags, completionMode]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        action: { const: delivered }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        orderId: { $ref: "#/components/schemas/Identifier" }
        bagIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/Identifier" } }
        actualBags: { type: integer, minimum: 1, maximum: 100 }
        station: { $ref: "#/components/schemas/Identifier" }
        completionMode: { type: string, enum: [attended, unattended] }
    OfflineDeliveryFailedAction:
      type: object
      additionalProperties: false
      required: [actionId, action, occurredAt, expectedVersion, orderId, bagIds, actualBags, failureReasonCode, customerContacted]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        action: { const: delivery_failed }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        orderId: { $ref: "#/components/schemas/Identifier" }
        bagIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/Identifier" } }
        actualBags: { type: integer, minimum: 1, maximum: 100 }
        station: { $ref: "#/components/schemas/Identifier" }
        failureReasonCode: { type: string, enum: [customer_unavailable, unsafe_handoff, bag_count_mismatch, route_interrupted, other_review_required] }
        customerContacted: { type: boolean }


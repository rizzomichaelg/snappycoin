            data: { $ref: "#/components/schemas/PudRelayReplayData" }
    PudDurableOperationEnvelope:
      allOf:
        - { $ref: "#/components/schemas/GenericSuccessEnvelope" }
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/PudDurableOperationData" }
    PudDurableBackupAttestationEnvelope:
      allOf:

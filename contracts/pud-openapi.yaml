        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/PudDailyReportingWatermarkData" }
    PudReportingArchiveEnvelope:
      allOf:
        - { $ref: "#/components/schemas/GenericSuccessEnvelope" }
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/PudReportingArchiveData" }
    PudReportingArchiveReconciliationEnvelope:
      allOf:
        - { $ref: "#/components/schemas/GenericSuccessEnvelope" }
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/PudReportingArchiveReconciliationData" }
    PudReadConsistencyProbeEnvelope:
      allOf:
        - { $ref: "#/components/schemas/GenericSuccessEnvelope" }
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/PudReadConsistencyProbeData" }
    PudReportingSloEvidenceEnvelope:
      allOf:

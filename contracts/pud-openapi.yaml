        thresholdMs: { type: integer, minimum: 1 }
        result: { type: string, enum: [met, missed] }
    PudDailyReportingData:
      type: object
      additionalProperties: false
      required: [rows, consistency, slo]
      properties:
        rows:
          type: array
          maxItems: 367
          items: { $ref: "#/components/schemas/PudDailyReportingRow" }
        consistency: { $ref: "#/components/schemas/PudDailyReportingConsistency" }
        slo: { $ref: "#/components/schemas/PudDailyReportingSlo" }
    PudDailyReportingWatermarkData:
      type: object
      additionalProperties: false
      required: [aggregateDay, locationId, sourceUpdatedAt, sourceSnapshotSha256, sourceRowCount, schemaVersion, materializedAt]
      properties:
        aggregateDay: { type: string, format: date }
        locationId: { $ref: "#/components/schemas/Identifier" }
        sourceUpdatedAt: { $ref: "#/components/schemas/UtcTimestamp" }
        sourceSnapshotSha256: { $ref: "#/components/schemas/PudSha256" }
        sourceRowCount: { type: integer, minimum: 1 }

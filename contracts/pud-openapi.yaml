        timingCounts: { type: object, additionalProperties: true }
        sourceUpdatedAt: { $ref: "#/components/schemas/UtcTimestamp" }
    PudDailyReportingConsistency:
      type: object
      additionalProperties: false
      required: [mode, bookmarkHmac]
      properties:
        mode: { type: string, enum: [primary, session] }
        bookmarkHmac:
          oneOf:
            - { $ref: "#/components/schemas/PudSha256" }
            - { type: "null" }
    PudDailyReportingSlo:
      type: object
      additionalProperties: false
      required: [durationMs, thresholdMs, result]

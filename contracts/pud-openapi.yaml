      x-roles: [manager]
      parameters:
        - { in: path, name: capability, required: true, schema: { $ref: "#/components/schemas/PudPhase2ScaleCapability" } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PudScaleGateRevocationRequest" } } } }

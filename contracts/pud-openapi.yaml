            - { type: "null" }
        p99Ms:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
        missed: { type: integer, minimum: 0 }
        gateMet: { type: boolean }
    PudRelayHealthEnvelope:

        "200": { $ref: "#/components/responses/PudDailyReporting" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/phase2/reporting/daily/seal:
    post:
      tags: [Phase 2 operations]
      operationId: sealPudPhase2DailyReporting
      security: [{ AccessJWT: [] }]
      x-roles: [manager]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PudDailySealRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/PudDailyReportingWatermark" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/phase2/reporting/archives:
    post:
      tags: [Phase 2 operations]
      operationId: archivePudPhase2DailyReporting
      security: [{ AccessJWT: [] }]
      x-roles: [manager]

      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PudReportingArchiveRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/PudReportingArchive" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/phase2/reporting/archives/{id}/reconcile:
    post:
      tags: [Phase 2 operations]
      operationId: reconcilePudPhase2ReportingArchive
      security: [{ AccessJWT: [] }]
      x-roles: [manager]
      parameters:
        - { in: path, name: id, required: true, schema: { $ref: "#/components/schemas/Identifier" } }
      responses:
        "200": { $ref: "#/components/responses/PudReportingArchiveReconciliation" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/phase2/reporting/archives/{id}/restore-drill:
    post:
      tags: [Phase 2 operations]
      operationId: provePudPhase2ReportingRestore
      security: [{ AccessJWT: [] }]
      x-roles: [manager]
      parameters:
        - { in: path, name: id, required: true, schema: { $ref: "#/components/schemas/Identifier" } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PudReportingRestoreRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/PudReportingArchive" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/phase2/reporting/read-consistency-probes:
    post:
      tags: [Phase 2 operations]
      operationId: probePudPhase2ReadConsistency
      security: [{ AccessJWT: [] }]
      x-roles: [manager]
      x-feature-flag: PUD_READ_REPLICA_ENABLED
      responses:
        "200": { $ref: "#/components/responses/PudReadConsistencyProbe" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/phase2/reporting/slo-evidence:
    get:
      tags: [Phase 2 operations]
      operationId: getPudPhase2ReportingSloEvidence
      security: [{ AccessJWT: [] }]
      x-roles: [manager]
      parameters:
        - { in: query, name: queryName, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { $ref: "#/components/responses/PudReportingSloEvidence" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    AccessJWT:
      type: http
      scheme: bearer
      bearerFormat: Cloudflare Access JWT
    DriverSession:
      type: apiKey
      in: header
      name: x-pud-driver-session
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
    SquareSignature:
      type: apiKey
      in: header
      name: x-square-hmacsha256-signature
    TwilioSignature:
      type: apiKey
      in: header
      name: X-Twilio-Signature
    ResendSignature:
      type: apiKey
      in: header
      name: svix-signature

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    BagCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    IdempotencyHeader:
      name: idempotency-key
      in: header
      required: true
      schema: { $ref: "#/components/schemas/IdempotencyKey" }

  requestBodies:
    AddressCheck: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressCheckRequest" } } } }
    AddressSuggestionAcceptance: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressSuggestionAcceptanceRequest" } } } }
    AddressAutocomplete: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressAutocompleteRequest" } } } }
    AddressAutocompleteSelection: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressAutocompleteSelectionRequest" } } } }
    Waitlist: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WaitlistRequest" } } } }
    PhoneStart: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PhoneStartRequest" } } } }
    PhoneResend: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PhoneResendRequest" } } } }
    PhoneVerify: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PhoneVerifyRequest" } } } }
    PaymentSetup: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSetupRequest" } } } }
    CreateOrder: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateOrderRequest" } } } }
    StatusToken: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusTokenRequest" } } } }
    StatusSession: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusSessionRequest" } } } }
    Feedback: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackSubmitRequest" } } } }
    StatusRecoveryStart: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusRecoveryStartRequest" } } } }
    StatusRecoveryVerify: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusRecoveryVerifyRequest" } } } }
    ActionCapability: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ActionCapabilityRequest" } } } }
    PortalHistory: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalHistoryRequest" } } } }
    PreferencesUpdate: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreferencesUpdateRequest" } } } }
    CancelOrder: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CancelOrderRequest" } } } }
    Reschedule: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RescheduleRequest" } } } }
    PaymentSession: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSessionRequest" } } } }
    PaymentMethod: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentMethodRequest" } } } }
    Reorder: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReorderRequest" } } } }
    Tip: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TipRequest" } } } }
    Claim: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimRequest" } } } }
    ClaimEvidenceCapability: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidenceCapabilityRequest" } } } }
    ClaimEvidenceGrant: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidenceGrantRequest" } } } }
    ClaimEvidenceUpload:
      required: true
      content:
        image/jpeg: { schema: { type: string, format: binary, maxLength: 5242880 } }
        image/png: { schema: { type: string, format: binary, maxLength: 5242880 } }
        application/pdf: { schema: { type: string, format: binary, maxLength: 5242880 } }
    LoyaltyCustomer: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyCustomerRequest" } } } }
    LoyaltyProgramCreate: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyProgramCreateRequest" } } } }
    LoyaltyRuleCreate: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyRuleCreateRequest" } } } }
    LoyaltyRuleApproval: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyRuleApprovalRequest" } } } }
    LoyaltyRulePublication: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyRulePublicationRequest" } } } }
    LoyaltyProgramTransition: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyProgramTransitionRequest" } } } }
    LoyaltyEarn: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyEarnRequest" } } } }
    LoyaltyRedeem: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyRedeemRequest" } } } }
    LoyaltyAdjustment: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyAdjustmentRequest" } } } }
    LoyaltyReason: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyReasonRequest" } } } }
    LoyaltyReviewResolution: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyReviewResolutionRequest" } } } }
    RecurringCreate: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringCreateRequest" } } } }
    RecurringAction: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringActionRequest" } } } }
    StatusTokenMutation: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusTokenMutationRequest" } } } }
    RouteCreate: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RouteCreateRequest" } } } }
    RoutePatch: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoutePatchRequest" } } } }

  responses:
    Error:
      description: PUD error envelope
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    GenericSuccess:
      description: Successful operation
      content: { application/json: { schema: { $ref: "#/components/schemas/GenericSuccessEnvelope" } } }
    PudRelayHealth:
      description: Managed relay state counts and bounded recent run evidence
      content: { application/json: { schema: { $ref: "#/components/schemas/PudRelayHealthEnvelope" } } }
    PudRelayRebuild:
      description: Managed relay reconciliation counts
      content: { application/json: { schema: { $ref: "#/components/schemas/PudRelayRebuildEnvelope" } } }
    PudRelayReplay:
      description: Dead-letter replay generation and resulting relay state
      content: { application/json: { schema: { $ref: "#/components/schemas/PudRelayReplayEnvelope" } } }
    PudDurableOperation:
      description: Browser-safe durable-operation projection; workflow instance identifiers are never returned
      content: { application/json: { schema: { $ref: "#/components/schemas/PudDurableOperationEnvelope" } } }
    PudDurableBackupAttestation:
      description: Receipt digest for an externally executed backup; target references are never returned
      content: { application/json: { schema: { $ref: "#/components/schemas/PudDurableBackupAttestationEnvelope" } } }
    PudPhase2ScaleGateState:
      description: Owner-controlled Phase 2 capability gate transition result
      content: { application/json: { schema: { $ref: "#/components/schemas/PudPhase2ScaleGateStateEnvelope" } } }
    PudDailyReporting:
      description: Aggregate-only daily reporting rows with pseudonymized consistency and SLO evidence
      content: { application/json: { schema: { $ref: "#/components/schemas/PudDailyReportingEnvelope" } } }
    PudDailyReportingWatermark:
      description: Immutable daily reporting source watermark
      content: { application/json: { schema: { $ref: "#/components/schemas/PudDailyReportingWatermarkEnvelope" } } }
    PudReportingArchive:
      description: Browser-safe reporting archive manifest; private object locators and ETags are never returned
      content: { application/json: { schema: { $ref: "#/components/schemas/PudReportingArchiveEnvelope" } } }
    PudReportingArchiveReconciliation:
      description: Archive reconciliation result and browser-safe manifest
      content: { application/json: { schema: { $ref: "#/components/schemas/PudReportingArchiveReconciliationEnvelope" } } }
    PudReadConsistencyProbe:
      description: Sequential read-consistency result with an HMAC of any session bookmark
      content: { application/json: { schema: { $ref: "#/components/schemas/PudReadConsistencyProbeEnvelope" } } }
    PudReportingSloEvidence:
      description: Production-volume reporting latency evidence
      content: { application/json: { schema: { $ref: "#/components/schemas/PudReportingSloEvidenceEnvelope" } } }
    PlatformSuccess:
      description: Successful authenticated platform operation
      content: { application/json: { schema: { $ref: "#/components/schemas/PlatformSuccessEnvelope" } } }
    PlatformError:
      description: Authenticated platform error envelope
      content: { application/json: { schema: { $ref: "#/components/schemas/PlatformErrorEnvelope" } } }
    GovernedPudExport:
      description: Browser-safe governed-export job; recipient public-key material and storage locators are omitted.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required: [ok, export]
            properties:
              ok: { type: boolean, const: true }
              export: { $ref: "#/components/schemas/GovernedPudExport" }
    PublicConfig:
      description: Browser-safe configuration
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicConfigEnvelope" } } }
    ProductAnalyticsIngest:
      description: Idempotent D1 acceptance summary for a bounded event batch
      content: { application/json: { schema: { $ref: "#/components/schemas/PudProductAnalyticsIngestEnvelope" } } }
    ProductAnalyticsAggregates:
      description: Bounded aggregate-only staff analytics response
      content: { application/json: { schema: { $ref: "#/components/schemas/PudProductAnalyticsAggregatesEnvelope" } } }
    ProductAnalyticsReconciliation:
      description: Manager-recorded D1/GA4 aggregate reconciliation
      content: { application/json: { schema: { $ref: "#/components/schemas/PudAnalyticsReconciliationEnvelope" } } }
    AddressCheck:
      description: Eligibility, sealed address proof, and capacity-filtered route proofs
      content: { application/json: { schema: { $ref: "#/components/schemas/AddressCheckEnvelope" } } }
    AddressAutocomplete:
      description: Bounded address suggestions from the configured server-side provider
      content: { application/json: { schema: { $ref: "#/components/schemas/AddressAutocompleteEnvelope" } } }
    AddressAutocompleteSelection:
      description: Structured address fields for a selected autocomplete suggestion
      content: { application/json: { schema: { $ref: "#/components/schemas/AddressAutocompleteSelectionEnvelope" } } }
    PhoneStart:
      description: New phone-verification identifier and masked destination
      content: { application/json: { schema: { $ref: "#/components/schemas/PhoneStartEnvelope" } } }
    PhoneResend:
      description: Extended verification expiry; the existing verification identifier remains client-held
      content: { application/json: { schema: { $ref: "#/components/schemas/PhoneResendEnvelope" } } }
    PhoneVerify:
      description: Short-lived phone proof returned only after approval
      content: { application/json: { schema: { $ref: "#/components/schemas/PhoneVerifyEnvelope" } } }
    PaymentSetup:
      description: SetupIntent client secret and checkout attempt identifier
      content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSetupEnvelope" } } }
    CreateOrder:
      description: Created or idempotently replayed order
      content: { application/json: { schema: { $ref: "#/components/schemas/CreateOrderEnvelope" } } }
    OrderStatus:
      description: Customer-safe status projection
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
        X-Robots-Tag: { schema: { type: string, const: noindex } }
      content: { application/json: { schema: { $ref: "#/components/schemas/OrderStatusEnvelope" } } }
    StatusSession:
      description: Short-lived session established by fresh phone verification
      content: { application/json: { schema: { $ref: "#/components/schemas/StatusSessionEnvelope" } } }
    Feedback:
      description: Idempotent private feedback receipt and neutral post-completion review destination
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackSubmitEnvelope" } } }
    StatusRecoveryStart:
      description: Enumeration-safe recovery challenge acknowledgement
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
        X-Robots-Tag: { schema: { type: string, const: noindex } }
      content: { application/json: { schema: { $ref: "#/components/schemas/StatusRecoveryStartEnvelope" } } }
    StatusRecoveryVerify:
      description: Generic verification outcome; a replacement link is delivered out of band only after an eligible match
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
        X-Robots-Tag: { schema: { type: string, const: noindex } }
      content: { application/json: { schema: { $ref: "#/components/schemas/StatusRecoveryVerifyEnvelope" } } }
    ActionCapability:
      description: Single-use, purpose/order/version-bound action capability
      content: { application/json: { schema: { $ref: "#/components/schemas/ActionCapabilityEnvelope" } } }
    PortalHistory:
      description: Customer-safe paginated history, receipts, claims, and anchor-order preferences
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
        X-Robots-Tag: { schema: { type: string, const: noindex } }
      content: { application/json: { schema: { $ref: "#/components/schemas/PortalHistoryEnvelope" } } }
    PreferencesUpdate:
      description: Customer-safe preference mutation receipt and refreshed anchor status
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/PreferencesUpdateEnvelope" } } }
    PaymentRecovery:
      description: Order-scoped replacement SetupIntent; this endpoint never creates a charge
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/PaymentRecoveryEnvelope" } } }
    Tip:
      description: Tip PaymentIntent result; clientSecret is present only when customer action is required
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/TipEnvelope" } } }
    ReorderBootstrap:
      description: Prefill for restarting the normal protected booking proof chain
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
        X-Robots-Tag: { schema: { type: string, const: noindex } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ReorderBootstrapEnvelope" } } }
    Waitlist:
      description: Browser-safe waitlist receipt
      content: { application/json: { schema: { $ref: "#/components/schemas/WaitlistEnvelope" } } }
    ClaimOpen:
      description: Browser-safe claim receipt
      content: { application/json: { schema: { $ref: "#/components/schemas/ClaimOpenEnvelope" } } }
    ClaimEvidenceCapability:
      description: One-use evidence-only action capability
      content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidenceCapabilityEnvelope" } } }
    ClaimEvidenceGrant:
      description: Short-lived declaration-bound private upload grant
      content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidenceGrantEnvelope" } } }
    ClaimEvidenceUpload:
      description: Final private sanitized and scanner-clean evidence reference; no public URL or storage key
      content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidenceUploadEnvelope" } } }
    LoyaltyCustomer:
      description: Customer-safe loyalty balance and bounded signed history
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/LoyaltyCustomerEnvelope" } } }
    Recurring:
      description: Browser-safe recurring schedule receipt
      content: { application/json: { schema: { $ref: "#/components/schemas/RecurringEnvelope" } } }
    StatusTokenRotation:
      description: Replacement status token and safe status; the prior token and its capabilities are revoked atomically
      content: { application/json: { schema: { $ref: "#/components/schemas/StatusTokenRotationEnvelope" } } }
    StatusTokenRevocation:
      description: Browser-safe revocation receipt; no bearer material is returned
      content: { application/json: { schema: { $ref: "#/components/schemas/StatusTokenRevocationEnvelope" } } }

  schemas:
    PudP256PublicKeyJwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y]
      properties:
        kty: { type: string, const: EC }
        crv: { type: string, const: P-256 }
        x: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        y: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        ext: { type: boolean, const: true }
        key_ops: { type: array, maxItems: 1, items: { type: string, const: verify } }
        alg: { type: string, maxLength: 32 }
    PudDriverEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [deviceId, driverEmail, label, publicKeyJwk]
      properties:
        deviceId: { $ref: "#/components/schemas/Identifier" }
        driverEmail: { type: string, format: email, maxLength: 254 }
        label: { type: string, minLength: 1, maxLength: 100 }
        publicKeyJwk: { $ref: "#/components/schemas/PudP256PublicKeyJwk" }
    PudDriverSessionRequest:
      type: object
      additionalProperties: false
      required: [schema, deviceId, routeId, requestId, issuedAt, signature]
      properties:
        schema: { type: string, const: snappycoin.pud.driver-session/v1 }
        deviceId: { $ref: "#/components/schemas/Identifier" }
        routeId: { $ref: "#/components/schemas/Identifier" }
        requestId: { $ref: "#/components/schemas/Identifier" }
        issuedAt: { $ref: "#/components/schemas/UtcTimestamp" }
        signature: { type: string, pattern: "^[A-Za-z0-9_-]{80,100}$" }
    PudDriverRevokeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        reasonCode: { type: string, enum: [lost, stolen, retired, staff_departure, key_compromise, other_review_required] }
    PudDriverDeliveryProof:
      type: object
      additionalProperties: false
      required: [kind, capturedAt, bagCount, bagCodesSha256, policyVersion]
      properties:
        kind: { type: string, enum: [attended_handoff, authorized_unattended] }
        capturedAt: { $ref: "#/components/schemas/UtcTimestamp" }
        bagCount: { type: integer, minimum: 1, maximum: 100 }
        bagCodesSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        policyVersion: { $ref: "#/components/schemas/Identifier" }
    PudDriverSignedAction:
      type: object
      additionalProperties: false
      required: [actionId, sequence, action, routeId, orderId, stopId, expectedVersion, expectedStopVersion, occurredAt, payload, signature]
      properties:
        actionId: { $ref: "#/components/schemas/Identifier" }
        sequence: { type: integer, minimum: 1, maximum: 1000000000 }
        action: { type: string, enum: [pickup, out_for_delivery, delivered, delivery_failed] }
        routeId: { $ref: "#/components/schemas/Identifier" }
        orderId: { $ref: "#/components/schemas/Identifier" }
        stopId: { $ref: "#/components/schemas/Identifier" }
        expectedVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        expectedStopVersion: { type: integer, minimum: 1, maximum: 1000000000 }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        signature: { type: string, pattern: "^[A-Za-z0-9_-]{80,100}$" }
        payload:
          oneOf:
            - type: object
              additionalProperties: false
              required: [actualBags, bagCodes, pickupMode]
              properties:
                actualBags: { type: integer, minimum: 1, maximum: 100 }
                bagCodes: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$" } }
                pickupMode: { type: string, enum: [attended, unattended] }
            - type: object
              additionalProperties: false
              required: [bagCodes]
              properties:
                bagCodes: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$" } }
            - type: object
              additionalProperties: false
              required: [bagCodes, completionMode, proof]
              properties:
                bagCodes: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$" } }
                completionMode: { type: string, enum: [attended, unattended] }
                proof: { $ref: "#/components/schemas/PudDriverDeliveryProof" }
            - type: object
              additionalProperties: false
              required: [failureReasonCode, customerContacted]
              properties:
                failureReasonCode: { type: string, enum: [customer_unavailable, unsafe_handoff, bag_count_mismatch, route_interrupted, other_review_required] }
                customerContacted: { type: boolean }
    PudDriverSyncRequest:
      type: object
      additionalProperties: false
      required: [schema, deviceId, routeId, actions]
      properties:
        schema: { type: string, const: snappycoin.pud.driver-sync/v1 }
        deviceId: { $ref: "#/components/schemas/Identifier" }
        routeId: { $ref: "#/components/schemas/Identifier" }
        actions: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PudDriverSignedAction" } }
    PudRelayRebuildRequest:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 2000, default: 500 }
    PudRelayReplayRequest:
      type: object
      additionalProperties: false
      required: [evidenceReference, confirmedNoProviderEffect]
      properties:
        evidenceReference: { type: string, minLength: 1, maxLength: 300 }
        confirmedNoProviderEffect: { type: boolean, const: true }
    PudDurableOperationType:
      type: string
      enum: [governed_export, privacy_deletion, key_rotation, backup, claims_evidence_processing]
    PudDurableOperationRequest:
      type: object
      additionalProperties: false
      required: [operationType, locationId, resourceType, resourceId, domainApprovalReference, intent, reason, expiresAt]
      properties:
        operationType: { $ref: "#/components/schemas/PudDurableOperationType" }
        locationId: { $ref: "#/components/schemas/Identifier" }
        resourceType: { type: string, minLength: 1, maxLength: 128 }
        resourceId: { type: string, minLength: 1, maxLength: 256 }
        domainApprovalReference: { type: string, minLength: 1, maxLength: 256 }
        intent: { type: object, additionalProperties: true }
        reason: { type: string, minLength: 1, maxLength: 2000, writeOnly: true }
        expiresAt: { $ref: "#/components/schemas/UtcTimestamp" }
    PudDurableResumeRequest:
      type: object
      additionalProperties: false
      properties:
        maxSteps: { type: integer, minimum: 1, maximum: 5, default: 5 }
    PudDurableBackupAttestationRequest:
      type: object
      additionalProperties: false
      required: [targetReference, evidenceSha256, executedAt]
      properties:
        targetReference: { type: string, minLength: 1, maxLength: 2048 }
        evidenceSha256: { $ref: "#/components/schemas/PudSha256" }
        executedAt: { $ref: "#/components/schemas/UtcTimestamp" }
    PudPhase2ScaleCapability:
      type: string
      enum: [managed_relay, durable_workflows, reporting_archive, analytics_engine, read_replica]
    PudScaleGateObservationRequest:
      type: object
      additionalProperties: false
      required: [triggerMetrics]
      properties:
        triggerMetrics: { type: object, maxProperties: 100, additionalProperties: true }
    PudScaleGateApprovalRequest:
      type: object
      additionalProperties: false
      required: [triggerMetrics, evidenceReference, expiresAt]
      properties:
        triggerMetrics: { type: object, maxProperties: 100, additionalProperties: true }
        evidenceReference: { type: string, minLength: 1, maxLength: 300 }
        expiresAt: { $ref: "#/components/schemas/UtcTimestamp" }
    PudScaleGateRevocationRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode: { type: string, pattern: "^[A-Za-z0-9._:-]{1,80}$" }
    PudDailySealRequest:
      type: object
      additionalProperties: false
      required: [locationId, aggregateDay]
      properties:
        locationId: { $ref: "#/components/schemas/Identifier" }
        aggregateDay: { type: string, format: date }
    PudReportingArchiveRequest:
      type: object
      additionalProperties: false
      required: [locationId, aggregateDay, retentionUntil]
      properties:
        locationId: { $ref: "#/components/schemas/Identifier" }
        aggregateDay: { type: string, format: date }
        retentionUntil: { $ref: "#/components/schemas/UtcTimestamp" }
    PudReportingRestoreRequest:
      type: object
      additionalProperties: false
      required: [isolatedTargetReference, externalEvidenceSha256, restoredSha256, restoredRowCount, completedAt]
      properties:
        isolatedTargetReference: { type: string, pattern: "^drill:[A-Za-z0-9._:/-]{1,293}$", maxLength: 300 }
        externalEvidenceSha256: { $ref: "#/components/schemas/PudSha256" }
        restoredSha256: { $ref: "#/components/schemas/PudSha256" }
        restoredRowCount: { type: integer, minimum: 1, maximum: 10000000 }
        completedAt: { $ref: "#/components/schemas/UtcTimestamp" }
    PudSha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    PudRelayProvider:
      type: string
      enum: [email, sms, staff]
    PudRelayState:
      type: string
      enum: [pending, publishing, queued, consuming, retry, acknowledged, dead, canceled]
    PudRelayStateCount:
      type: object
      additionalProperties: false
      required: [provider, status, count, oldest_due_at]
      properties:
        provider: { $ref: "#/components/schemas/PudRelayProvider" }
        status: { $ref: "#/components/schemas/PudRelayState" }
        count: { type: integer, minimum: 0 }
        oldest_due_at:
          oneOf:
            - { $ref: "#/components/schemas/UtcTimestamp" }
            - { type: "null" }
    PudRelayRun:
      type: object
      additionalProperties: false
      required:
        - operation
        - provider
        - status
        - scanned_count
        - published_count
        - acknowledged_count
        - retry_count
        - dead_count
        - duplicate_count
        - backlog_before
        - backlog_after
        - oldest_due_age_seconds
        - queue_backlog_count
        - recovery_objective_seconds
        - objective_met
        - started_at
        - completed_at
      properties:
        operation: { type: string, enum: [publish, consume, dead_letter, rebuild, replay] }
        provider:
          oneOf:
            - { $ref: "#/components/schemas/PudRelayProvider" }
            - { type: string, const: all }
        status: { type: string, enum: [success, partial, failed] }
        scanned_count: { type: integer, minimum: 0 }
        published_count: { type: integer, minimum: 0 }
        acknowledged_count: { type: integer, minimum: 0 }
        retry_count: { type: integer, minimum: 0 }
        dead_count: { type: integer, minimum: 0 }
        duplicate_count: { type: integer, minimum: 0 }
        backlog_before: { type: integer, minimum: 0 }
        backlog_after: { type: integer, minimum: 0 }
        oldest_due_age_seconds:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
        queue_backlog_count:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
        recovery_objective_seconds: { type: integer, minimum: 1 }
        objective_met: { type: integer, enum: [0, 1] }
        started_at: { $ref: "#/components/schemas/UtcTimestamp" }
        completed_at: { $ref: "#/components/schemas/UtcTimestamp" }
    PudRelayHealthData:
      type: object
      additionalProperties: false
      required: [enabled, states, recentRuns]
      properties:
        enabled: { type: boolean, const: true }
        states:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/PudRelayStateCount" }
        recentRuns:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PudRelayRun" }
    PudRelayRebuildData:
      type: object
      additionalProperties: false
      required: [inserted, staleRequeued, effectsRepaired, ambiguousQuarantined]
      properties:
        inserted: { type: integer, minimum: 0 }
        staleRequeued: { type: integer, minimum: 0 }
        effectsRepaired: { type: integer, minimum: 0 }
        ambiguousQuarantined: { type: integer, minimum: 0 }
    PudRelayReplayData:
      type: object
      additionalProperties: false
      required: [outboxId, generation, status]
      properties:
        outboxId: { $ref: "#/components/schemas/Identifier" }
        generation: { type: integer, minimum: 2 }
        status: { type: string, const: pending }
    PudDurableOperationStatus:
      type: string
      enum: [pending_approval, approved, running, retry, completed, failed, canceled, expired]
    PudDurableOperationData:
      type: object
      additionalProperties: false
      required:
        - id
        - operationType
        - locationId
        - resourceType
        - resourceId
        - domainApprovalReference
        - intentSha256
        - approvalBindingSha256
        - requiredApprovals
        - executionMode
        - workflowAttached
        - status
        - currentStepIndex
        - expiresAt
        - approvedAt
        - startedAt
        - completedAt
        - failureCode
        - version
        - createdAt
        - updatedAt
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        operationType: { $ref: "#/components/schemas/PudDurableOperationType" }
        locationId: { $ref: "#/components/schemas/Identifier" }
        resourceType: { type: string, minLength: 1, maxLength: 128 }
        resourceId: { type: string, minLength: 1, maxLength: 256 }
        domainApprovalReference: { type: string, minLength: 1, maxLength: 256 }
        intentSha256: { $ref: "#/components/schemas/PudSha256" }
        approvalBindingSha256: { $ref: "#/components/schemas/PudSha256" }
        requiredApprovals: { type: integer, enum: [1, 2] }
        executionMode: { type: string, enum: [d1_lease, workflow] }
        workflowAttached: { type: boolean }
        status: { $ref: "#/components/schemas/PudDurableOperationStatus" }
        currentStepIndex: { type: integer, minimum: 0, maximum: 5 }
        expiresAt: { $ref: "#/components/schemas/UtcTimestamp" }
        approvedAt:
          oneOf:
            - { $ref: "#/components/schemas/UtcTimestamp" }
            - { type: "null" }
        startedAt:
          oneOf:
            - { $ref: "#/components/schemas/UtcTimestamp" }
            - { type: "null" }
        completedAt:
          oneOf:
            - { $ref: "#/components/schemas/UtcTimestamp" }
            - { type: "null" }
        failureCode:
          oneOf:
            - { type: string, minLength: 1, maxLength: 256 }
            - { type: "null" }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: "#/components/schemas/UtcTimestamp" }
        updatedAt: { $ref: "#/components/schemas/UtcTimestamp" }
    PudDurableBackupAttestationData:
      type: object
      additionalProperties: false
      required: [evidenceSha256, executedAt, replay]
      properties:
        evidenceSha256: { $ref: "#/components/schemas/PudSha256" }
        executedAt: { $ref: "#/components/schemas/UtcTimestamp" }
        replay: { type: boolean }
    PudPhase2ScaleGateStateData:

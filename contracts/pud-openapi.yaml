openapi: 3.1.0
info:
  title: Snappy Pickup-and-Delivery API
  version: 1.0.0
  description: |
    Frozen transport contract for the PUD bounded context. All money is integer cents,
    weight and mileage are integer tenths, and operational timestamps are UTC ISO-8601.
    Customer status tokens are sent only in POST bodies. Every response carries requestId.
servers:
  - url: https://api.snappycoinlaundry.com
    description: Production
  - url: https://api-staging.snappycoinlaundry.com
    description: Staging
tags:
  - name: Public
  - name: Product analytics
  - name: Webhooks
  - name: Staff orders
  - name: Staff routes
  - name: Staff operations
  - name: Staff administration
  - name: Growth
  - name: Platform governance
  - name: Operational planning
  - name: Security operations
  - name: Phase 2 operations
  - name: Offline driver

paths:
  /api/pud/public-config:
    get:
      tags: [Public]
      operationId: getPudPublicConfig
      x-feature-flag: PUD_PUBLIC_ENABLED
      responses:
        "200": { $ref: "#/components/responses/PublicConfig" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/analytics/events:
    post:
      tags: [Product analytics]
      operationId: ingestPudProductAnalytics
      x-feature-flag: PUD_PRODUCT_ANALYTICS_ENABLED
      description: |
        Accepts only the versioned PII-free taxonomy. The flag uses exact-string
        `true`; event and session identifiers are random UUIDv4 values, and D1
        stores only the session HMAC. GA4 delivery, when consented, is client-side
        and is reconciled only at aggregate level.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PudProductEventBatch" }
      responses:
        "200": { $ref: "#/components/responses/ProductAnalyticsIngest" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/analytics:
    get:
      tags: [Product analytics]
      operationId: listPudProductAnalyticsAggregates
      security: [{ AccessJWT: [] }]
      x-roles: [staff, manager]
      description: Returns only daily aggregates, guardrails, reconciliation evidence, and signed filter-bound continuation cursors.
      parameters:
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 4096 } }
        - { in: query, name: guardrailCursor, schema: { type: string, maxLength: 4096 } }
        - { in: query, name: reconciliationCursor, schema: { type: string, maxLength: 4096 } }
      responses:
        "200": { $ref: "#/components/responses/ProductAnalyticsAggregates" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/analytics/reconciliations:
    post:
      tags: [Product analytics]
      operationId: reconcilePudProductAnalyticsAggregate
      security: [{ AccessJWT: [] }]
      x-roles: [manager]
      description: Manager-only aggregate comparison. Variance below 2% matches; larger variance requires documented evidence to be explained.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PudAnalyticsReconciliationRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProductAnalyticsReconciliation" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/address/check:
    post:
      tags: [Public]
      operationId: checkPudAddress
      x-feature-flag: PUD_PUBLIC_ENABLED
      x-idempotency: sealed address proof plus rate limit
      requestBody: { $ref: "#/components/requestBodies/AddressCheck" }
      responses:
        "200": { $ref: "#/components/responses/AddressCheck" }
        "202": { $ref: "#/components/responses/AddressCheck" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/address/suggestion/accept:
    post:
      tags: [Public]
      operationId: acceptPudAddressSuggestion
      x-feature-flag: PUD_PUBLIC_ENABLED
      x-idempotency: short-lived suggestion proof bound to the original address check and suggested address hash
      requestBody: { $ref: "#/components/requestBodies/AddressSuggestionAcceptance" }
      responses:
        "200": { $ref: "#/components/responses/AddressCheck" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/address/autocomplete:
    post:
      tags: [Public]
      operationId: autocompletePudAddress
      x-feature-flag: PUD_ADDRESS_AUTOCOMPLETE_ENABLED
      x-idempotency: rate limited, no customer data persisted
      requestBody: { $ref: "#/components/requestBodies/AddressAutocomplete" }
      responses:
        "200": { $ref: "#/components/responses/AddressAutocomplete" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/address/autocomplete/select:
    post:
      tags: [Public]
      operationId: selectPudAddressAutocomplete
      x-feature-flag: PUD_ADDRESS_AUTOCOMPLETE_ENABLED
      x-idempotency: rate limited, no customer data persisted
      requestBody: { $ref: "#/components/requestBodies/AddressAutocompleteSelection" }
      responses:
        "200": { $ref: "#/components/responses/AddressAutocompleteSelection" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/waitlist:
    post:
      tags: [Public]
      operationId: joinPudWaitlist
      x-feature-flag: PUD_PUBLIC_ENABLED
      x-idempotency: address proof replay protection and HMAC deduplication
      requestBody: { $ref: "#/components/requestBodies/Waitlist" }
      responses:
        "200": { $ref: "#/components/responses/Waitlist" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/phone/start:
    post:
      tags: [Public]
      operationId: startPudPhoneVerification
      requestBody: { $ref: "#/components/requestBodies/PhoneStart" }
      responses:
        "200": { $ref: "#/components/responses/PhoneStart" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/phone/resend:
    post:
      tags: [Public]
      operationId: resendPudPhoneVerification
      requestBody: { $ref: "#/components/requestBodies/PhoneResend" }
      responses:
        "200": { $ref: "#/components/responses/PhoneResend" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/phone/verify:
    post:
      tags: [Public]
      operationId: verifyPudPhone
      requestBody: { $ref: "#/components/requestBodies/PhoneVerify" }
      responses:
        "200": { $ref: "#/components/responses/PhoneVerify" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/payment/setup:
    post:
      tags: [Public]
      operationId: setupPudPaymentMethod
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/PaymentSetup" }
      responses:
        "200": { $ref: "#/components/responses/PaymentSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders:
    post:
      tags: [Public]
      operationId: createPudOrder
      x-feature-flag: PUD_BOOKING_ENABLED
      x-idempotency: required; duplicate returns original order
      requestBody: { $ref: "#/components/requestBodies/CreateOrder" }
      responses:
        "200": { $ref: "#/components/responses/CreateOrder" }
        "201": { $ref: "#/components/responses/CreateOrder" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/status:
    post:
      tags: [Public]
      operationId: getPudOrderStatus
      requestBody: { $ref: "#/components/requestBodies/StatusToken" }
      responses:
        "200": { $ref: "#/components/responses/OrderStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/status-session:
    post:
      tags: [Public]
      operationId: createPudStatusSession
      description: Consumes a fresh phone proof matching the status-token owner and returns a short-lived verified session.
      requestBody: { $ref: "#/components/requestBodies/StatusSession" }
      responses:
        "200": { $ref: "#/components/responses/StatusSession" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/feedback:
    post:
      tags: [Public]
      operationId: submitPudOrderFeedback
      x-feature-flag: PUD_FEEDBACK_ENABLED
      x-idempotency: required
      description: Records one private post-delivery satisfaction answer from a current phone-verified status session. Poor feedback opens an audited support case; the optional review link is neutral across both answers.
      requestBody: { $ref: "#/components/requestBodies/Feedback" }
      responses:
        "200": { $ref: "#/components/responses/Feedback" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/status-recovery/start:
    post:
      tags: [Public]
      operationId: startPudStatusLinkRecovery
      x-feature-flag: PUD_STATUS_RECOVERY_ENABLED
      description: Starts a short-lived phone challenge. The same generic contract is returned whether or not the email and phone identify an eligible order.
      requestBody: { $ref: "#/components/requestBodies/StatusRecoveryStart" }
      responses:
        "200": { $ref: "#/components/responses/StatusRecoveryStart" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/status-recovery/verify:
    post:
      tags: [Public]
      operationId: verifyPudStatusLinkRecovery
      x-feature-flag: PUD_STATUS_RECOVERY_ENABLED
      description: Verifies the phone challenge and, only for a matching eligible order, atomically replaces the private status token and sends it out of band. No status token or match indicator is returned to the browser.
      requestBody: { $ref: "#/components/requestBodies/StatusRecoveryVerify" }
      responses:
        "200": { $ref: "#/components/responses/StatusRecoveryVerify" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/action-capability:
    post:
      tags: [Public]
      operationId: issuePudActionCapability
      description: Issues one short-lived, single-use capability bound to the requested purpose, order, status-token generation, and current order version.
      requestBody: { $ref: "#/components/requestBodies/ActionCapability" }
      responses:
        "200": { $ref: "#/components/responses/ActionCapability" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/history:
    post:
      tags: [Public]
      operationId: listPudCustomerPortalHistory
      description: Returns a bounded page of PUD and walk-in history only after the order owner establishes a short-lived, client-bound verified status session. The opaque cursor is encrypted and customer-bound.
      requestBody: { $ref: "#/components/requestBodies/PortalHistory" }
      responses:
        "200": { $ref: "#/components/responses/PortalHistory" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/preferences:
    post:
      tags: [Public]
      operationId: updatePudOrderPreferences
      description: Updates the mutable anchor order's service preferences with a purpose-bound one-use capability and a durable idempotency receipt.
      x-idempotency: required; exact lost-response replay returns the committed result
      requestBody: { $ref: "#/components/requestBodies/PreferencesUpdate" }
      responses:
        "200": { $ref: "#/components/responses/PreferencesUpdate" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/cancel:
    post:
      tags: [Public]
      operationId: cancelPudOrder
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/CancelOrder" }
      responses:
        "200": { $ref: "#/components/responses/OrderStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/reschedule-request:
    post:
      tags: [Public]
      operationId: requestPudReschedule
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/Reschedule" }
      responses:
        "200": { $ref: "#/components/responses/OrderStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/payment-session:
    post:
      tags: [Public]
      operationId: createPudPaymentRemediationSession
      requestBody: { $ref: "#/components/requestBodies/PaymentSession" }
      responses:
        "200": { $ref: "#/components/responses/PaymentRecovery" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/payment-method:
    post:
      tags: [Public]
      operationId: replacePudPaymentMethod
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/PaymentMethod" }
      responses:
        "200": { $ref: "#/components/responses/OrderStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/reorder:
    post:
      tags: [Public]
      operationId: reorderPudOrder
      x-feature-flag: PUD_BOOKING_ENABLED
      requestBody: { $ref: "#/components/requestBodies/Reorder" }
      responses:
        "200": { $ref: "#/components/responses/ReorderBootstrap" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/tip:
    post:
      tags: [Public]
      operationId: tipPudOrder
      x-feature-flag: PUD_TIPS_ENABLED
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/Tip" }
      responses:
        "200": { $ref: "#/components/responses/Tip" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/claim:
    post:
      tags: [Public]
      operationId: openPudClaim
      x-feature-flag: PUD_CLAIMS_ENABLED
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/Claim" }
      responses:
        "200": { $ref: "#/components/responses/ClaimOpen" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/claim-evidence/capability:
    post:
      tags: [Public]
      operationId: issuePudClaimEvidenceCapability
      description: Issues a short-lived one-use capability for only the claim-evidence upload flow after a fresh verified status session.
      x-feature-flag: PUD_CLAIM_EVIDENCE_ENABLED
      requestBody: { $ref: "#/components/requestBodies/ClaimEvidenceCapability" }
      responses:
        "200": { $ref: "#/components/responses/ClaimEvidenceCapability" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/claim-evidence/grant:
    post:
      tags: [Public]
      operationId: createPudClaimEvidenceUploadGrant
      description: Consumes one evidence capability and binds a private upload grant to the exact order, client, token generation, SHA-256, byte size, and media type.
      x-feature-flag: PUD_CLAIM_EVIDENCE_ENABLED
      requestBody: { $ref: "#/components/requestBodies/ClaimEvidenceGrant" }
      responses:
        "201": { $ref: "#/components/responses/ClaimEvidenceGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/claim-evidence/upload:
    post:
      tags: [Public]
      operationId: uploadPudClaimEvidence
      description: Uploads one declared private object into quarantine; only sanitized, scanner-clean bytes are finalized. No public URL or storage key is returned.
      x-feature-flag: PUD_CLAIM_EVIDENCE_ENABLED
      parameters:
        - in: header
          name: x-pud-upload-grant
          required: true
          schema: { $ref: "#/components/schemas/Token" }
      requestBody: { $ref: "#/components/requestBodies/ClaimEvidenceUpload" }
      responses:
        "201": { $ref: "#/components/responses/ClaimEvidenceUpload" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/loyalty:
    post:
      tags: [Public, Growth]
      operationId: getPudCustomerLoyalty
      description: Returns a customer-safe balance and bounded history after fresh status-session verification. No customer ID, rule, actor, accounting, fraud, or idempotency data is returned.
      x-feature-flag: PUD_LOYALTY_ENABLED
      requestBody: { $ref: "#/components/requestBodies/LoyaltyCustomer" }
      responses:
        "200": { $ref: "#/components/responses/LoyaltyCustomer" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/status-token/rotate:
    post:
      tags: [Public]
      operationId: rotatePudStatusToken
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/StatusTokenMutation" }
      responses:
        "200": { $ref: "#/components/responses/StatusTokenRotation" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/orders/status-token/revoke:
    post:
      tags: [Public]
      operationId: revokePudStatusToken
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/StatusTokenMutation" }
      responses:
        "200": { $ref: "#/components/responses/StatusTokenRevocation" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/recurring:
    post:
      tags: [Public]
      operationId: createPudRecurringSchedule
      x-feature-flag: PUD_RECURRING_ENABLED
      x-idempotency: required
      requestBody: { $ref: "#/components/requestBodies/RecurringCreate" }
      responses:
        "200": { $ref: "#/components/responses/Recurring" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/recurring/pause:
    post:
      tags: [Public]
      operationId: pausePudRecurringSchedule
      x-feature-flag: PUD_RECURRING_ENABLED
      requestBody: { $ref: "#/components/requestBodies/RecurringAction" }
      responses:
        "200": { $ref: "#/components/responses/Recurring" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/recurring/skip:
    post:
      tags: [Public]
      operationId: skipPudRecurringProposal
      x-feature-flag: PUD_RECURRING_ENABLED
      requestBody: { $ref: "#/components/requestBodies/RecurringAction" }
      responses:
        "200": { $ref: "#/components/responses/Recurring" }
        default: { $ref: "#/components/responses/Error" }

  /api/pud/recurring/resume:
    post:
      tags: [Public]
      operationId: resumePudRecurringSchedule
      x-feature-flag: PUD_RECURRING_ENABLED
      requestBody: { $ref: "#/components/requestBodies/RecurringAction" }
      responses:
        "200": { $ref: "#/components/responses/Recurring" }
        default: { $ref: "#/components/responses/Error" }

  /api/webhooks/stripe:
    post:
      tags: [Webhooks]
      operationId: receiveStripeWebhook
      security: [{ StripeSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        default: { $ref: "#/components/responses/Error" }

  /api/webhooks/square:
    post:
      tags: [Webhooks]
      operationId: receiveSquareWebhook
      security: [{ SquareSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        default: { $ref: "#/components/responses/Error" }

  /api/webhooks/twilio/messaging:
    post:
      tags: [Webhooks]
      operationId: receiveTwilioMessagingWebhook
      security: [{ TwilioSignature: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded: { schema: { type: object, additionalProperties: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        default: { $ref: "#/components/responses/Error" }

  /api/webhooks/resend:
    post:
      tags: [Webhooks]
      operationId: receiveResendWebhook
      security: [{ ResendSignature: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        default: { $ref: "#/components/responses/Error" }

  /api/admin/pud/board:
    get:
      tags: [Staff orders]
      operationId: getPudBoard
      parameters:
        - in: query
          name: sort
          description: Sort within operational/payment priority, with stable order-number and ID ties. Changing sort requires a fresh cursor.
          schema:
            type: string
            enum: [schedule_asc, schedule_desc, submitted_desc, submitted_asc]
            default: schedule_asc
      security: [{ AccessJWT: [] }]
      x-roles: [staff, manager, driver]
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, default: { $ref: "#/components/responses/Error" } }

  /api/admin/pud/orders/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      tags: [Staff orders]
      operationId: getPudOrder
      security: [{ AccessJWT: [] }]
      x-roles: [staff, manager, driver]
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, default: { $ref: "#/components/responses/Error" } }

  /api/admin/pud/orders/{id}/confirm:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminConfirm" }
  /api/admin/pud/orders/{id}/reschedule:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminReschedule" }
  /api/admin/pud/orders/{id}/labels:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminBagLabels" }
  /api/admin/pud/orders/{id}/pickup:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminPickup" }
  /api/admin/pud/orders/{id}/pickup-failed:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminPickupFailed" }
  /api/admin/pud/orders/{id}/intake:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminIntake" }
  /api/admin/pud/orders/{id}/weight:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminWeight" }
  /api/admin/pud/orders/{id}/charge:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminCharge" }
  /api/admin/pud/orders/{id}/ready:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminReady" }
  /api/admin/pud/orders/{id}/out-for-delivery:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminOutForDelivery" }
  /api/admin/pud/orders/{id}/deliver:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminDeliver" }
  /api/admin/pud/orders/{id}/delivery-failed:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    post: { $ref: "#/components/x-path-operations/AdminDeliveryFailed" }

        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/PudReportingSloEvidenceData" }
    PudAnalyticsSessionId:
      type: string
      pattern: "^session:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    PudAnalyticsEventId:
      type: string
      pattern: "^event:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    PudAnalyticsEventName:
      type: string
      enum: [site_page_viewed, cta_clicked, pud_session_started, pud_page_viewed, pud_address_eligible, pud_address_ineligible, pud_waitlist_joined, pud_booking_started, pud_phone_verified, pud_card_saved, pud_order_submitted, pud_experiment_exposed]
    PudAnalyticsParameters:
      type: object
      additionalProperties: false
      description: The server applies the narrower per-event allowlist and rejects PII, bearer material, full URLs, query/fragment material, and provider secrets.
      properties:
        navigationType: { type: string, enum: [navigate, reload, back_forward, prerender, unknown] }
        ctaId: { type: string, enum: [hero_pickup, nav_pickup, promo_claim, cookie_preferences, pickup_submit, pickup_recover, other] }
        destinationCategory: { type: string, enum: [pickup_booking, promotion, preferences, status_recovery, same_page, other] }
        reasonCategory: { type: string, enum: [outside_area, needs_review, capacity, unknown] }
        duplicate: { type: boolean }
    PudAnalyticsExperimentSnapshot:
      type: object
      additionalProperties: false
      required: [experimentId, assignmentVersion, variant, holdout]
      properties:
        experimentId: { type: string, const: booking_flow_v1 }
        assignmentVersion: { type: string, const: booking-flow-assignment-v1 }
        variant: { type: string, enum: [control, streamlined] }
        holdout: { type: boolean }
    PudProductEvent:
      type: object
      additionalProperties: false
      required: [eventId, name, occurredAt, pageKey, locale, parameters, experiment]
      properties:
        eventId: { $ref: "#/components/schemas/PudAnalyticsEventId" }
        name: { $ref: "#/components/schemas/PudAnalyticsEventName" }
        occurredAt: { $ref: "#/components/schemas/UtcTimestamp" }
        pageKey: { type: string, enum: [home, pickup_delivery, privacy, terms, cookies] }
        locale: { $ref: "#/components/schemas/PudLocale" }
        parameters: { $ref: "#/components/schemas/PudAnalyticsParameters" }
        experiment:
          oneOf:
            - { $ref: "#/components/schemas/PudAnalyticsExperimentSnapshot" }
            - { type: "null" }
    PudProductEventBatch:
      type: object
      additionalProperties: false
      required: [sessionId, events]
      properties:
        sessionId: { $ref: "#/components/schemas/PudAnalyticsSessionId" }
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/PudProductEvent" }
    PudProductAnalyticsIngestEnvelope:
      allOf:
        - { $ref: "#/components/schemas/GenericSuccessEnvelope" }
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [accepted, duplicates, taxonomyVersion]
              properties:
                accepted: { type: integer, minimum: 0, maximum: 20 }
                duplicates: { type: integer, minimum: 0, maximum: 20 }
                taxonomyVersion: { type: string, const: pud-product-analytics-v1 }
    PudAnalyticsReconciliationRequest:
      type: object
      additionalProperties: false
      required: [day, eventName, ga4Count]
      properties:
        day: { type: string, format: date }
        eventName: { $ref: "#/components/schemas/PudAnalyticsEventName" }
        ga4Count: { type: integer, minimum: 0, maximum: 100000000 }
        explanation: { type: string, minLength: 10, maxLength: 500 }
        evidenceReference: { type: string, minLength: 3, maxLength: 300 }
    PudAnalyticsReconciliation:
      type: object
      additionalProperties: false
      required: [day, eventName, d1Count, ga4Count, varianceBps, status]
      properties:
        day: { type: string, format: date }
        eventName: { $ref: "#/components/schemas/PudAnalyticsEventName" }
        d1Count: { type: integer, minimum: 0 }
        ga4Count: { type: integer, minimum: 0 }
        varianceBps: { type: integer, minimum: 0 }
        status: { type: string, enum: [matched, explained, attention] }

name: Static site verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify cutover routes and retained marketing integrations
        run: node --test test/*.test.mjs
      - name: Verify approved public baseline
        run: node scripts/verify-public-baseline.mjs
      - name: Verify promotion, newsletter, and conversion behavior
        run: node tools/verify-promo-signup.js
